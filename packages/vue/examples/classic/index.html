  const { ref, onBeforeMount, onMounted, onBeforeUpdate, onUpdated } = Vue
  Vue.createApp({
    setup() {
      const val = ref(false)
      const text = ref('aaaa')
      const submit = () => {
        val.value = !val.value
        text.value = 'vue3 test ' + (val.value ? 'true' : 'false')
      }

      onBeforeMount(() => {
        console.log('onBeforeMount')
      })
      onMounted(() => {
        console.log('onMounted')
      })
      onBeforeUpdate(() => {
        console.log('onBeforeUpdate')
      })
      onUpdated(() => {
        console.log('onUpdated')
      })
      return {
        val,
        text,
        submit
      }
    }
  }).mount('#app')
</script>
